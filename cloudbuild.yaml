{
  "substitutions": {
    "_TAG": "manual"
  },
  "steps": [
    {
      "id": "build-env",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "umask 077; gcloud secrets versions access latest --secret=dam-env > .env.production"
      ]
    },
    {
      "id": "linux-build-and-check",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "--target",
        "build",
        "-t",
        "ci-check:$BUILD_ID",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "office-domain-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "rm -f .env .env.* && npm run test:office-domain && npm run test:storage && npm test && npm run test:quota-ui"
      ]
    },
    {
      "id": "unit-storage-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "node --test scripts/schema-readiness.check.cjs && npm run test:storage"
      ]
    },
    {
      "id": "runtime-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-dam/dam:${_TAG}-$BUILD_ID",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "export-runtime-layers",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "save",
        "-o",
        ".ci-image.tar",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-dam/dam:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "verify-no-secret-layers",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "python3",
      "args": [
        "scripts/gcp-scan-image.py",
        ".ci-image.tar",
        ".env.production"
      ]
    },
    {
      "id": "install-schema-proxy",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "docker create --name schema-proxy-binary gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.0 >/dev/null; trap \"docker rm -f schema-proxy-binary >/dev/null\" EXIT; docker cp schema-proxy-binary:/cloud-sql-proxy /workspace/.ci-cloud-sql-proxy; chmod 755 /workspace/.ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "active-source-schema-readiness",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "--network",
        "cloudbuild",
        "-v",
        "/workspace/.env.production:/run/secrets/build-env:ro",
        "-v",
        "/workspace/.ci-cloud-sql-proxy:/run/cloudsql-proxy:ro",
        "ci-check:$BUILD_ID",
        "node",
        "scripts/schema-readiness.cjs",
        "dam"
      ]
    },
    {
      "id": "remove-build-inputs",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "rm -f .ci-image.tar .env.production .ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "push-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-dam/dam:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "release",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-c",
        "set -euo pipefail\nimage='us-west1-docker.pkg.dev/$PROJECT_ID/ci-dam/dam:${_TAG}-$BUILD_ID'\ndigest=$(gcloud artifacts docker images describe \"$$image\" --format='value(image_summary.digest)')\nexport CI_SERVICE='dam' CI_BUILD_ID='$BUILD_ID' CI_IMAGE=\"$${image%:*}@$$digest\"\npython3 scripts/gcp-release.py\n"
      ]
    }
  ],
  "images": [
    "us-west1-docker.pkg.dev/$PROJECT_ID/ci-dam/dam:${_TAG}-$BUILD_ID"
  ],
  "options": {
    "machineType": "E2_HIGHCPU_8",
    "logging": "CLOUD_LOGGING_ONLY"
  },
  "timeout": "1800s"
}
